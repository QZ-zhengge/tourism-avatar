# Project-wide Gradle settings.
# 添加 analytics 禁用参数到 JVM 参数（在 Gradle 启动前生效）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dandroid.disableAnalytics=true -Dandroid.analytics.disabled=true -Dorg.gradle.internal.analytics.disable=true
# Kotlin code style
kotlin.code.style=official
# Parallel project execution
org.gradle.parallel=true
# Configuration cache 关闭 — 修复 Gradle 9.3.1 + AGP 9.x 的 ProviderBackedFileCollectionSpec 序列化 bug
org.gradle.configuration-cache=false
# Use Android Studio's bundled JDK 21 (matches AGP 9.x requirement)
# 同时兼容 AGP 8.7.3（JDK 21 JBR 自带，覆盖默认 toolchain）
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin
kotlin.incremental=true
# AGP 10+ 默认值（消除 deprecation 警告）
android.defaults.buildfeatures.resvalues=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
# android.enableAppCompileTimeRClass=true   # AGP 8.x 仍为实验性，移除
android.usesSdkInManifest.disallowed=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
android.newDsl=true
# 性能优化提示（disable 旧建议）
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# 屏蔽 AGP 8.7.3 不支持 compileSdk=36 的警告
android.suppressUnsupportedCompileSdk=36
# android.builtInKotlin — AGP 9.x 内置 Kotlin，不设置（或设为 true）才能编译 .kt 文件
# 原 false 会导致所有 Kotlin 类无法编译进 APK（ClassNotFoundException 根因）
# android.builtInKotlin=false
# 禁用 Android Analytics 服务（避免 spool 文件写入错误）
android.disableAnalytics=true
android.analytics.disabled=true
org.gradle.internal.analytics.disable=true
# 禁用 Android Studio 的 analytics（通过 system properties）
systemProp.android.disableAnalytics=true
systemProp.android.analytics.disabled=true
